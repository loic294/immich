name: External library API image

on:
  workflow_dispatch:
  push:
    branches:
      - external-library-api-v3.4.1

permissions:
  contents: read

concurrency:
  group: external-library-api-v3.4.1-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/loic294/immich-server

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_ID=external-library-api-v3.4.1
            BUILD_IMAGE=${{ env.IMAGE }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.4.1-external-library-api
            org.opencontainers.image.title=Immich external library API
          cache-from: type=gha,scope=external-library-api-v3.4.1-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=external-library-api-v3.4.1-${{ matrix.arch }}
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and inspect manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=3.4.1-external-library-api" \
            --annotation "index:org.opencontainers.image.title=Immich external library API" \
            --tag "$IMAGE:external-library-api-v3.4.1" \
            --tag "$IMAGE:external-library-api-v3.4.1-$GITHUB_SHA" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:external-library-api-v3.4.1"
